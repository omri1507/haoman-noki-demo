<script>
// Device detection - change background video based on device
(function() {
    const isMobile = /Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const bgvid = document.getElementById('bgvid');
    const bgvidSource = document.getElementById('bgvid-source');

    if (isMobile) {
        bgvid.poster = 'img/mob.png';
        bgvidSource.src = 'img/mob.mov';
        bgvid.load();
    }
})();
</script>
<script>
// UTM parameters auto-fill
(function() {
    const params = new URLSearchParams(window.location.search);
    ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'].forEach(function (key) {
        const el = document.getElementById(key);
        if (el && params.has(key)) {
            el.value = params.get(key);
        }
    });
})();
</script>
<script>
// Form submission handler with Bamby CRM integration
document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const fullName = document.getElementById('full_name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const marketingConsent = document.getElementById('marketing').checked;
    const formError = document.getElementById('formError');

    // Basic validation
    if (!fullName || (!phone && !email)) {
        formError.textContent = 'נא למלא שם מלא וטלפון או אימייל.';
        formError.style.display = 'block';
        return;
    }

    // Hide error
    formError.style.display = 'none';

    // Split full name into first and last name
    let firstName = fullName;
    let lastName = '';
    if (fullName.includes(' ')) {
        const nameParts = fullName.split(/\s+/);
        firstName = nameParts[0];
        lastName = nameParts.slice(1).join(' ');
    }

    // Get UTM parameters
    const utmSource = document.getElementById('utm_source').value || '';
    const utmMedium = document.getElementById('utm_medium').value || '';
    const utmCampaign = document.getElementById('utm_campaign').value || '';
    const utmTerm = document.getElementById('utm_term').value || '';
    const utmContent = document.getElementById('utm_content').value || '';

    // Bamby CRM configuration
    const bambyConfig = {
        projectId: 'demo',              // Your ProjectID from Bamby
        password: 'demo',        // Your Password from Bamby
        mediaTitle: 'דף משקיעים',   // Campaign source
        website: 'https://lp.haoman.co.il'  // Your website URL
    };

    // Prepare Bamby CRM parameters
    const bambyParams = new URLSearchParams();
    bambyParams.append('Fname', firstName);
    bambyParams.append('Lname', lastName);
    bambyParams.append('Mobile', phone);
    bambyParams.append('Email', email);
    bambyParams.append('MediaTitle', bambyConfig.mediaTitle);
    bambyParams.append('MailingConfirmation', marketingConsent);
    bambyParams.append('SmsConfirmation', marketingConsent);
    bambyParams.append('ref', document.referrer || bambyConfig.website);
    bambyParams.append('ProjectID', bambyConfig.projectId);
    bambyParams.append('Password', bambyConfig.password);

    // Add UTM parameters if present
    if (utmSource) bambyParams.append('utm_source', utmSource);
    if (utmMedium) bambyParams.append('utm_medium', utmMedium);
    if (utmCampaign) bambyParams.append('utm_campaign', utmCampaign);
    if (utmTerm) bambyParams.append('utm_term', utmTerm);
    if (utmContent) bambyParams.append('utm_content', utmContent);

    // Prepare Make.com webhook data
    const makeWebhookData = {
        firstName: firstName,
        lastName: lastName,
        fullName: fullName,
        phone: phone,
        email: email,
        marketingConsent: marketingConsent,
        website: bambyConfig.website,
        productTitle: bambyConfig.productTitle,
        mediaTitle: bambyConfig.mediaTitle,
        utm_source: utmSource,
        utm_medium: utmMedium,
        utm_campaign: utmCampaign,
        utm_term: utmTerm,
        utm_content: utmContent,
        timestamp: new Date().toISOString()
    };

    // Submit to both Bamby CRM and Make.com webhook in parallel
    const bambyPromise = nokiDemoSubmit('crm', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: bambyParams.toString(),
        mode: 'no-cors' // Bamby doesn't return CORS headers
    });

    const makePromise = nokiDemoSubmit('webhook', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(makeWebhookData),
        mode: 'no-cors'
    });

    // Wait for both requests to complete
    Promise.all([bambyPromise, makePromise])
    .then(() => {
        // Show thank you message
        document.getElementById('contactForm').style.display = 'none';
        document.getElementById('thankYouMessage').style.display = 'block';

        // Scroll to form
        document.getElementById('contact').scrollIntoView({ behavior: 'smooth' });
    })
    .catch((error) => {
        console.error('Error:', error);
        formError.textContent = 'אירעה תקלה בשליחת הפרטים. אנא נסה שוב.';
        formError.style.display = 'block';
    });
});
</script>
